name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Check coverage
        working-directory: backend
        run: |
          pip install pytest-cov
          python -m pytest tests/ -v --cov=sekhmet --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx oxlint src
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sekhmet .
      - name: Smoke test — 容器起服务、SPA 与 API 均可用
        run: |
          docker run -d --name sekhmet -p 8000:8000 sekhmet
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs sekhmet; exit 1; fi
          curl -sf http://localhost:8000/ | grep -qi "<html"
          curl -sf http://localhost:8000/history/42 | grep -qi "<html"  # SPA 回落
          curl -sf http://localhost:8000/api/trainer/scenarios | grep -q '"scenarios"'
          curl -sf http://localhost:8000/api/history/hands | grep -q '"hands"'
          docker rm -f sekhmet
