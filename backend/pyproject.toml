[project]
name = "sekhmet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=13",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
# Only `sekhmet` is a distribution package.  `data/` holds the generated
# scenario YAMLs and `tests/` is not shipped, so pin the discovery to
# avoid the flat-layout "multiple top-level packages" build error.
include = ["sekhmet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hanging test (e.g. a WebSocket receive that never comes) must fail
# fast instead of stalling the suite — CI once burned a 6h job on this.
timeout = 60
